<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ThuChi+ | Onboarding</title>
  <link rel="stylesheet" href="./css/style.css">
</head>

<body>
  <div class="phone">
    <div class="status-bar">
      <span>9:41</span>
      <span class="status-icons">📶 📡 🔋</span>
    </div>

    <div class="screen">
      <a href="#" class="skip-link">Bỏ qua <span aria-hidden="true">›</span></a>

      <div class="onboarding-art">
        <div class="brand-mark">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#cff468" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="9"></circle>
            <path d="M9 12l2 2 4-4"></path>
          </svg>
        </div>
        <div class="float-card">
          <div class="tx-avatar" style="background:#e4573d;">AB</div>
          <div class="tx-info">
            <div class="tx-name" style="color:#fff;">Nhận tiền</div>
            <div class="tx-date" style="color:rgba(255,255,255,.55);">Armando Broja</div>
          </div>
          <div class="tx-value positive">+350.000</div>
        </div>
      </div>

      <h1 class="display-xl">Xây Dựng<br>Nền Tảng<br>Tài Chính Vững Vàng.</h1>
      <p class="body-md" style="margin-top:10px;">Chủ động quản lý thu chi, tiết kiệm và chuyển tiền thông minh, an toàn — chỉ trong một ứng dụng.</p>

      <div class="dots">
        <span></span>
        <span class="active"></span>
        <span></span>
      </div>

      <div class="stack gap-12 mt-auto">
        <a href="./login.html" class="btn btn-outline">Đăng nhập</a>
        <a href="./login.html?mode=register" class="btn btn-primary">Tạo tài khoản</a>
      </div>
    </div>
  </div>
</body>

</html>
