<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ThuChi+ | Đăng nhập</title>
  <link rel="stylesheet" href="./css/style.css">
</head>

<body>
  <div class="phone">
    <div class="status-bar">
      <span>9:41</span>
      <span class="status-icons">📶 📡 🔋</span>
    </div>

    <div class="screen">
      <div class="top-bar">
        <a href="./index.html" class="circle-btn" aria-label="Quay lại">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg>
        </a>
        <span class="title-md">Đăng nhập</span>
        <span style="width:38px;"></span>
      </div>

      <div style="margin:18px 0 22px;">
        <h1 class="title-lg">Chào mừng trở lại 👋</h1>
        <p class="body-md" style="margin-top:6px;">Đăng nhập để tiếp tục quản lý tài chính của bạn.</p>
      </div>

      <form class="stack gap-16" onsubmit="return false;">
        <div class="field">
          <label for="email">Email hoặc số điện thoại</label>
          <input id="email" type="text" placeholder="ban@email.com" autocomplete="username">
        </div>

        <div class="field">
          <label for="password">Mật khẩu</label>
          <div class="field-pw-wrap">
            <input id="password" type="password" placeholder="••••••••" autocomplete="current-password">
            <button type="button" class="icon-btn light" aria-label="Hiện mật khẩu">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"></path><circle cx="12" cy="12" r="3"></circle></svg>
            </button>
          </div>
        </div>

        <a href="#" class="body-sm" style="align-self:flex-end; font-weight:700; color:var(--text);">Quên mật khẩu?</a>

        <button type="submit" class="btn btn-dark">Đăng nhập</button>
      </form>

      <div class="stack gap-16" style="margin-top:22px;">
        <div class="divider-text">hoặc tiếp tục với</div>
        <div class="social-row">
          <button class="social-btn" aria-label="Đăng nhập với Google">
            <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#EA4335" d="M12 10.2v3.9h5.5c-.24 1.3-1.7 3.8-5.5 3.8-3.3 0-6-2.7-6-6s2.7-6 6-6c1.9 0 3.1.8 3.9 1.5l2.6-2.5C16.9 3.4 14.7 2.4 12 2.4 6.9 2.4 2.7 6.6 2.7 11.7S6.9 21 12 21c6.9 0 9.6-4.9 9.6-7.4 0-.5-.1-.9-.1-1.3H12z"></path></svg>
          </button>
          <button class="social-btn" aria-label="Đăng nhập với Apple">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M16.7 1.4c.1 1.1-.3 2.2-1 3-.7.8-1.9 1.5-3 1.4-.1-1.1.4-2.2 1-3 .8-.8 2-1.3 3-1.4zM20.9 17c-.6 1.3-.9 1.9-1.6 3-1 1.5-2.5 3.4-4.3 3.4-1.6 0-2-1-4.1-1s-2.6 1-4.2 1c-1.8 0-3.2-1.7-4.2-3.2C.1 17.1-.7 12.6 1 9.6c.9-1.6 2.5-2.6 4.1-2.6 1.6 0 2.6 1.1 4 1.1 1.3 0 2.1-1.1 4-1.1 1.4 0 2.9.8 4 2.1-3.5 1.9-2.9 6.9.8 7.9z"></path></svg>
          </button>
        </div>
      </div>

      <p class="auth-switch mt-auto">Chưa có tài khoản? <a href="./index.html">Tạo tài khoản</a></p>
      <a href="./home.html" class="btn btn-primary" style="margin-top:14px;">→ Xem thử Trang chủ (demo)</a>
    </div>
  </div>
</body>

</html>
