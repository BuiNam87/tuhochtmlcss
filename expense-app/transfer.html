<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ThuChi+ | Chuyển tiền</title>
  <link rel="stylesheet" href="./css/style.css">
</head>

<body>
  <div class="phone">
    <div class="status-bar">
      <span>9:41</span>
      <span class="status-icons">📶 📡 🔋</span>
    </div>

    <div class="screen" style="gap:18px;">
      <div class="top-bar">
        <a href="./home.html" class="circle-btn" aria-label="Quay lại">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg>
        </a>
        <span class="title-md">Chuyển tiền</span>
        <button class="circle-btn" aria-label="Thêm">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.6"></circle><circle cx="12" cy="12" r="1.6"></circle><circle cx="19" cy="12" r="1.6"></circle></svg>
        </button>
      </div>

      <div class="amount-card">
        <div class="amount-row">
          <div>
            <div class="label">Nhập số tiền</div>
            <div class="value">1.000 <span style="font-size:13px; color:var(--text-muted);">VND</span></div>
          </div>
        </div>
        <div class="amount-divider"></div>
        <div class="amount-row">
          <div>
            <div class="label">Bạn sẽ nhận được</div>
            <div class="value">16.887.000 <span style="font-size:13px; color:var(--text-muted);">IDR</span></div>
          </div>
        </div>
        <span class="swap-btn" aria-hidden="true">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 10l5-6 5 6M7 14l5 6 5-6"></path></svg>
        </span>
        <div class="rate-row">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"></circle><path d="M12 16v-4M12 8h.01"></path></svg>
          Tỷ giá tham khảo: <b>1 VND = 16.89 IDR</b>
        </div>
      </div>

      <div>
        <div class="body-sm" style="font-weight:700; color:var(--text); margin-bottom:8px;">Gửi đến</div>
        <div class="recipient-card">
          <div class="tx-avatar" style="background:#ff9900;">AZ</div>
          <div class="tx-info">
            <div class="tx-name">Azzahri Alpiana</div>
            <div class="tx-date">0895 XXXX XXXX</div>
          </div>
          <a href="#" class="change-link">Đổi</a>
        </div>
      </div>

      <div class="numpad">
        <button>1</button>
        <button>2</button>
        <button>3</button>
        <button>4</button>
        <button>5</button>
        <button>6</button>
        <button>7</button>
        <button>8</button>
        <button>9</button>
        <button class="ghost">.</button>
        <button>0</button>
        <button class="ghost" aria-label="Xoá">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 4H8l-7 8 7 8h13a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z"></path><path d="M18 9l-6 6M12 9l6 6"></path></svg>
        </button>
      </div>

      <a href="#" class="btn btn-primary">Gửi tiền</a>
    </div>
  </div>
</body>

</html>
